pe": "F", "q": "버퍼 오버플로우가 주로 발생하는 이유를 쓰시오.", "answer": "할당된 메모리보다 큰 데이터를 경계 검사 없이 처리하기 때문", "keywords": ["메모리", "큰데이터", "경계검사", "버퍼"], "no": 48}, {"type": "A", "q": "과적합에 대한 올바른 설명을 쓰시오.", "answer": "학습 성능은 높지만 테스트 성능이 낮을 수 있다", "keywords": ["학습성능", "테스트성능", "낮", "과적합"], "no": 49}, {"type": "B", "q": "과적합에 대한 설명을 쓰시오.", "answer": "학습 데이터에 지나치게 맞아 새 데이터에 약해진다", "keywords": ["학습데이터", "새데이터", "약", "과적합"], "no": 50}, {"type": "C", "q": "자율주행차의 센서에 해당하는 것을 쓰시오.", "answer": "카메라와 라이다", "keywords": ["카메라", "라이다"], "no": 51}, {"type": "D", "q": "진로 데이터 분석 프로젝트의 첫 단계를 쓰시오.", "answer": "분석할 진로 질문과 필요한 데이터 정하기", "keywords": ["진로질문", "필요한데이터", "정하기"], "no": 52}, {"type": "E", "q": "오픈 데이터의 가치에 해당하는 사례를 쓰시오.", "answer": "공공 버스 위치 API를 공개해 다양한 앱 개발에 활용", "keywords": ["공공", "버스", "api", "앱"], "no": 53}, {"type": "F", "q": "유료 게임 설치 파일을 무단 복사해주는 행동이 무엇인지 쓰시오.", "answer": "저작권 침해", "keywords": ["저작권", "침해"], "no": 54}, {"type": "A", "q": "머신러닝 프로젝트의 최종 목표를 쓰시오.", "answer": "정의한 문제를 잘 해결하는 일반화 성능 좋은 모델 만들기", "keywords": ["문제", "일반화", "성능", "모델"], "no": 55}, {"type": "B", "q": "scikit-learn의 일관된 API 장점을 쓰시오.", "answer": "fit, predict 같은 비슷한 방식으로 다양한 모델을 사용할 수 있다", "keywords": ["fit", "predict", "다양한모델"], "no": 56}, {"type": "C", "q": "지능 에이전트 수업에서 클래스를 사용하는 이유를 쓰시오.", "answer": "상태와 행동을 하나의 단위로 묶기 위해", "keywords": ["상태", "행동", "묶"], "no": 57}, {"type": "D", "q": "프로그래밍 기술 사용에서 가장 중요한 윤리 원칙을 쓰시오.", "answer": "남에게 피해를 주지 않고 책임 있게 사용한다", "keywords": ["피해", "책임", "윤리"], "no": 58}, {"type": "E", "q": "비밀번호 저장 방식으로 가장 안전한 표준에 가까운 것을 쓰시오.", "answer": "단방향 해시 값으로 저장", "keywords": ["단방향", "해시"], "no": 59}, {"type": "F", "q": "보안 취약점을 발견했을 때 책임감 있는 공개 원칙에 맞는 행동을 쓰시오.", "answer": "관리자나 보안팀에 비공개로 알리고 수정 시간을 준다", "keywords": ["관리자", "보안팀", "비공개", "수정시간"], "no": 60}];
let questionBank = questions.slice();
let currentForm = "A";
let answers = [];
let answerTimes = [];
let startTime = nowText();
let lastScore = 0;

const formSeeds = {
  A: 101, B: 211, C: 307, D: 401, E: 503,
  F: 601, G: 701, H: 809, I: 907, J: 1009
};

function seededRandom(seed) {
  const x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function shuffledQuestions(form) {
  const arr = questionBank.map(item => ({...item}));
  let seed = formSeeds[form] || 101;
  for (let i = arr.length - 1; i > 0; i--) {
    seed += i * 97;
    const j = Math.floor(seededRandom(seed) * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr.map((item, idx) => ({...item, no: idx + 1}));
}

function setFormType(form) {
  currentForm = form;
  questions.length = 0;
  shuffledQuestions(form).forEach(q => questions.push(q));
  answers = Array(questions.length).fill("");
  answerTimes = Array(questions.length).fill("");
  startTime = nowText();

  "ABCDEFGHIJ".split("").forEach(t => {
    document.getElementById("form" + t).classList.toggle("active", t === form);
  });

  document.getElementById("formNotice").textContent =
    "현재 " + form + "형입니다. 60문항 순서가 " + form + "형 순서로 섞였습니다.";
  document.getElementById("result").textContent = "제출 전";
  document.getElementById("output").style.display = "none";
  renderQuiz();
}

function norm(s) {
  return (s || "").toLowerCase().replace(/\s+/g, "").trim();
}

function renderQuiz() {
  const quiz = document.getElementById("quiz");
  quiz.innerHTML = questions.map((item, i) => `
    <article class="question">
      <div class="type">${item.type} 영역</div>
      <div class="q-title">${i + 1}. ${item.q}</div>
      <input class="answer" id="ans${i}" oninput="recordAnswer(${i})" placeholder="단답형 답안 입력">
    </article>
  `).join("");
}

function recordAnswer(i) {
  answers[i] = document.getElementById("ans" + i).value;
  answerTimes[i] = nowText();
}

function isCorrect(user, item) {
  const u = norm(user);
  if (!u) return false;
  if (norm(item.answer) === u) return true;
  return item.keywords.some(k => {
    const kk = norm(k);
    return u.includes(kk) || kk.includes(u);
  });
}

function nowText() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}

function safeName(s) {
  return (s || "미입력").replace(/[\\/:*?"<>|\s]+/g, "_");
}

function makeResultText(correctCount, submitTime) {
  const sid = document.getElementById("studentId").value || "미입력";
  const name = document.getElementById("studentName").value || "미입력";
  lastScore = Math.round(correctCount / questions.length * 100);

  let text = "";
  text += "학번: " + sid + "\n";
  text += "이름: " + name + "\n";
  text += "문형: " + currentForm + "형\n";
  text += "문항 구성: A~F 영역 골고루 혼합 단답형 60문항\n";
  text += "점수: " + lastScore + "점 (" + correctCount + "/" + questions.length + ")\n";
  text += "시작시각: " + startTime + "\n";
  text += "제출시각: " + submitTime + "\n";
  text += "========================================\n\n";

  questions.forEach((item, i) => {
    const user = document.getElementById("ans" + i).value || "미응답";
    const ok = isCorrect(user, item) ? "정답 인정" : "오답";
    const atime = answerTimes[i] || "미응답";
    text += (i + 1) + "번 [" + item.type + " 영역]\n";
    text += "문제: " + item.q + "\n";
    text += "내 답: " + user + "\n";
    text += "모범 답안: " + item.answer + "\n";
    text += "정오답: " + ok + "\n";
    text += "문항 응답시각: " + atime + "\n";
    text += "----------------------------------------\n\n";
  });

  return text;
}

function submitQuiz() {
  const unanswered = [];
  questions.forEach((q, i) => {
    const v = document.getElementById("ans" + i).value.trim();
    if (!v) unanswered.push(i + 1);
  });

  if (unanswered.length > 0) {
    const go = confirm("미응답 문항이 있습니다.\n미응답 번호: " + unanswered.join(", ") + "\n그래도 제출할까요?");
    if (!go) return;
  }

  let correctCount = 0;
  questions.forEach((item, i) => {
    const user = document.getElementById("ans" + i).value;
    if (isCorrect(user, item)) correctCount++;
  });

  const submitTime = nowText();
  const text = makeResultText(correctCount, submitTime);
  const sid = document.getElementById("studentId").value || "미입력";
  const name = document.getElementById("studentName").value || "미입력";
  const stamp = submitTime.replace(/[-: ]/g, "");
  const fileName = safeName(sid) + "_" + safeName(name) + "_" + currentForm + "형_" + lastScore + "점_" + stamp + ".txt";

  document.getElementById("result").textContent = "제출 완료: " + lastScore + "점 (" + correctCount + "/" + questions.length + ")";
  document.getElementById("resultText").value = text;

  const encoded = encodeURIComponent("\ufeff" + text);
  const downloadBox = document.getElementById("downloadBox");
  downloadBox.innerHTML = "";

  const link = document.createElement("a");
  link.className = "download-link";
  link.textContent = "결과 TXT 다운로드";
  link.download = fileName;
  link.href = "data:text/plain;charset=utf-8," + encoded;
  downloadBox.appendChild(link);

  const copyBtn = document.createElement("button");
  copyBtn.className = "copy-btn";
  copyBtn.textContent = "TXT 내용 복사";
  copyBtn.onclick = function() {
    const box = document.getElementById("resultText");
    box.focus();
    box.select();
    document.execCommand("copy");
    copyBtn.textContent = "복사 완료";
  };
  downloadBox.appendChild(copyBtn);

  document.getElementById("output").style.display = "block";
  document.getElementById("output").scrollIntoView({ behavior: "smooth" });
}

setFormType("A");
</script>
