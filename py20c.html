<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>파이썬 프로그래밍 단답형 문제은행 300문항</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;font-family:"Malgun Gothic",Arial,sans-serif;color:#172033;line-height:1.65}
header{background:linear-gradient(135deg,#2563eb,#0f766e);color:#fff;text-align:center;padding:32px 16px}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0;opacity:.95}
.wrap{max-width:1080px;margin:24px auto;padding:0 16px 70px}
.card{background:#fff;border:1px solid #dbe4ee;border-radius:18px;padding:24px;margin-bottom:20px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
h2{margin:0 0 14px;border-bottom:2px solid #e5edf5;padding-bottom:10px;color:#0f3f71}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
label{display:block;font-weight:800;margin-bottom:6px}
input[type=text]{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:900;cursor:pointer;background:#2563eb;color:white}
button:hover{filter:brightness(.95)}
.success{background:#0f766e}.danger{background:#dc2626}.secondary{background:#475569}
.hidden{display:none}
.notice{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:12px;margin-top:12px}
.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#e0f2fe;color:#075985;font-weight:800;margin:0 6px 12px 0;font-size:13px}
.question{border:1px solid #dbe4ee;border-radius:16px;padding:18px;margin:14px 0;background:#fbfdff}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}
.qno{font-weight:900;color:#0f3f71}
.topic{font-size:13px;background:#f1f5f9;border-radius:999px;padding:5px 9px;color:#334155;font-weight:800}
.qtext{white-space:pre-wrap;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:14px;font-size:16px}
.answerInput{margin-top:12px}
.hint{font-size:13px;color:#64748b;margin-top:6px}
.scorebox{text-align:center;background:#ecfdf5;border:1px solid #a7f3d0;color:#0f766e;border-radius:14px;padding:16px;font-size:23px;font-weight:900;margin-bottom:15px}
.result-item{border-radius:14px;padding:15px;margin:12px 0}
.correct{background:#dcfce7;border-left:7px solid #16a34a}
.incorrect{background:#fee2e2;border-left:7px solid #dc2626}
.explanation{background:rgba(255,255,255,.75);border-radius:10px;padding:10px;margin-top:8px}
.stat{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.stat div{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:9px;text-align:center;font-weight:800;font-size:13px}
code{background:#e2e8f0;border-radius:5px;padding:2px 5px}
@media(max-width:800px){.grid,.stat{grid-template-columns:1fr}header h1{font-size:23px}}
</style>
</head>
<body>
<header>
<h1>파이썬 프로그래밍 단답형 문제은행 300문항</h1>
<p>15개 영역 × 20문항 = 총 300문항 · 매번 골고루 20문항 랜덤 출제</p>
<p>단답형 입력 · 자동채점 · 상세풀이 · TXT 저장</p>
</header>

<div class="wrap">
<form id="quizForm" onsubmit="gradeQuiz(event)">
<section class="card">
<h2>1. 인적사항 입력</h2>
<div class="grid">
<div><label for="studentId">학번</label><input id="studentId" type="text" required placeholder="예: 1101"></div>
<div><label for="name">이름</label><input id="name" type="text" required placeholder="예: 홍길동"></div>
<div><label for="className">반 / 수업명</label><input id="className" type="text" placeholder="선택 입력"></div>
</div>
<div class="notice">
출제 방식: 15개 영역에서 먼저 1문항씩 뽑고, 나머지 5문항은 전체 문제은행에서 중복 없이 추가 추출하여 총 20문항을 구성합니다.
</div>
<div class="controls">
<button type="button" class="success" onclick="startQuiz()">20문항 랜덤 출제</button>
<button type="button" class="secondary" onclick="location.reload()">처음부터 다시</button>
</div>
</section>

<section class="card">
<h2>2. 문제은행 구성</h2>
<span class="badge">총 300문항</span>
<span class="badge">15개 영역</span>
<span class="badge">영역별 20문항</span>
<div id="bankStats" class="stat"></div>
</section>

<section id="quizCard" class="card hidden">
<h2>3. 단답형 퀴즈 20문항</h2>
<span class="badge">총 20문항</span>
<span class="badge">문항당 1점</span>
<span class="badge">골고루 랜덤 출제</span>
<div id="questionsArea"></div>
<div class="controls"><button type="submit" class="danger">채점하고 TXT 저장</button></div>
</section>
</form>

<section id="resultCard" class="card hidden">
<h2>4. 채점 결과 및 상세 풀이</h2>
<div id="results"></div>
</section>
</div>

<script>
const BANK = [{"id": "딕셔01", "category": "딕셔너리", "question": "키와 값의 쌍으로 데이터를 저장하는 파이썬 자료형을 쓰시오.", "answer": "딕셔너리", "aliases": ["dict", "dictionary"], "explanation": "딕셔너리는 key:value 형태로 데이터를 저장하는 자료형입니다."}, {"id": "딕셔02", "category": "딕셔너리", "question": "딕셔너리에서 값을 찾을 때 사용하는 고유한 이름을 쓰시오.", "answer": "키", "aliases": ["key"], "explanation": "키는 딕셔너리에서 값을 찾는 식별자입니다."}, {"id": "딕셔03", "category": "딕셔너리", "question": "딕셔너리에서 키에 연결되어 저장되는 데이터를 쓰시오.", "answer": "값", "aliases": ["value"], "explanation": "값은 키와 연결되어 저장되는 실제 데이터입니다."}, {"id": "딕셔04", "category": "딕셔너리", "question": "딕셔너리의 모든 키를 반환하는 메서드를 쓰시오.", "answer": "keys()", "aliases": ["keys", ".keys()"], "explanation": "keys()는 딕셔너리의 모든 키를 반환합니다."}, {"id": "딕셔05", "category": "딕셔너리", "question": "딕셔너리의 모든 값을 반환하는 메서드를 쓰시오.", "answer": "values()", "aliases": ["values", ".values()"], "explanation": "values()는 딕셔너리의 모든 값을 반환합니다."}, {"id": "딕셔06", "category": "딕셔너리", "question": "딕셔너리의 모든 키-값 쌍을 반환하는 메서드를 쓰시오.", "answer": "items()", "aliases": ["items", ".items()"], "explanation": "items()는 키와 값을 쌍으로 반환합니다."}, {"id": "딕셔07", "category": "딕셔너리", "question": "존재하지 않는 키에 접근해도 오류 대신 기본값을 줄 수 있는 메서드를 쓰시오.", "answer": "get()", "aliases": ["get", ".get()"], "explanation": "get()은 키가 없을 때 None 또는 지정한 기본값을 반환합니다."}, {"id": "딕셔08", "category": "딕셔너리", "question": "딕셔너리에 다른 딕셔너리 내용을 병합하는 메서드를 쓰시오.", "answer": "update()", "aliases": ["update", ".update()"], "explanation": "update()는 다른 딕셔너리의 내용을 기존 딕셔너리에 반영합니다."}, {"id": "딕셔09", "category": "딕셔너리", "question": "딕셔너리에서 특정 키의 값을 꺼내고 해당 항목을 삭제하는 메서드를 쓰시오.", "answer": "pop()", "aliases": ["pop", ".pop()"], "explanation": "pop()은 지정한 키의 값을 반환하고 항목을 삭제합니다."}, {"id": "딕셔10", "category": "딕셔너리", "question": "딕셔너리에서 모든 항목을 삭제하는 메서드를 쓰시오.", "answer": "clear()", "aliases": ["clear", ".clear()"], "explanation": "clear()는 딕셔너리를 빈 상태로 만듭니다."}, {"id": "딕셔11", "category": "딕셔너리", "question": "빈 딕셔너리를 만드는 기호를 쓰시오.", "answer": "{}", "aliases": ["dict()"], "explanation": "{} 또는 dict()로 빈 딕셔너리를 만들 수 있습니     .replace(/[.]/g, "")
    .replace(/[（）]/g, m => m === "（" ? "(" : ")")
    .replace(/，/g, ",");
}

function isCorrect(user, q) {
  const u = normalize(user);
  const answers = [q.answer, ...(q.aliases || [])].map(normalize);
  return answers.includes(u);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderStats() {
  const box = document.getElementById("bankStats");
  const cats = [...new Set(BANK.map(q => q.category))];
  box.innerHTML = cats.map(cat => {
    const n = BANK.filter(q => q.category === cat).length;
    return `<div>${cat}<br>${n}문항</div>`;
  }).join("");
}

function startQuiz() {
  const studentId = document.getElementById("studentId").value.trim();
  const name = document.getElementById("name").value.trim();
  if (!studentId || !name) {
    alert("학번과 이름을 먼저 입력하세요.");
    return;
  }

  const cats = [...new Set(BANK.map(q => q.category))];
  let picked = [];
  cats.forEach(cat => {
    const pool = BANK.filter(q => q.category === cat);
    picked.push(shuffle(pool)[0]);
  });

  const pickedIds = new Set(picked.map(q => q.id));
  const rest = shuffle(BANK.filter(q => !pickedIds.has(q.id))).slice(0, 5);
  selectedQuestions = shuffle([...picked, ...rest]).slice(0, 20);

  const area = document.getElementById("questionsArea");
  area.innerHTML = selectedQuestions.map((q, idx) => `
    <div class="question">
      <div class="qtop">
        <span class="qno">${idx + 1}번</span>
        <span class="topic">${q.category}</span>
      </div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      <div class="answerInput">
        <input type="text" id="ans_${idx}" required placeholder="정답을 입력하세요">
        <div class="hint">단답형으로 입력하세요. 예: def, list, strip(), __init__, DataFrame</div>
      </div>
    </div>
  `).join("");

  document.getElementById("quizCard").classList.remove("hidden");
  document.getElementById("resultCard").classList.add("hidden");
  window.scrollTo({top: document.getElementById("quizCard").offsetTop - 10, behavior: "smooth"});
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function safeFileName(s) {
  return String(s).replace(/[\\/:*?"<>|\s]+/g, "_");
}

function nowText() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}-${pad(d.getSeconds())}`;
}

function gradeQuiz(e) {
  e.preventDefault();
  if (selectedQuestions.length !== 20) {
    alert("먼저 20문항 랜덤 출제를 눌러 주세요.");
    return;
  }

  const studentId = document.getElementById("studentId").value.trim();
  const name = document.getElementById("name").value.trim();
  const className = document.getElementById("className").value.trim();
  const time = nowText();

  let score = 0;
  const rows = selectedQuestions.map((q, idx) => {
    const user = document.getElementById(`ans_${idx}`).value.trim();
    const ok = isCorrect(user, q);
    if (ok) score++;
    return {idx: idx + 1, q, user, ok};
  });

  const results = document.getElementById("results");
  results.innerHTML = `<div class="scorebox">점수: ${score} / 20</div>` + rows.map(r => `
    <div class="result-item ${r.ok ? "correct" : "incorrect"}">
      <b>${r.idx}번 [${r.q.category}]</b> ${r.ok ? "정답" : "오답"}<br>
      <b>문제:</b> ${escapeHtml(r.q.question)}<br>
      <b>학생답:</b> ${escapeHtml(r.user || "(미입력)")}<br>
      <b>정답:</b> <code>${escapeHtml(r.q.answer)}</code>
      <div class="explanation"><b>상세풀이:</b> ${escapeHtml(r.q.explanation)}</div>
    </div>
  `).join("");

  document.getElementById("resultCard").classList.remove("hidden");

  let txt = "";
  txt += `학번: ${studentId}\n`;
  txt += `이름: ${name}\n`;
  txt += `반/수업명: ${className || "미입력"}\n`;
  txt += `총점: ${score}/20\n`;
  txt += `응시시각: ${time}\n`;
  txt += `문제은행: 파이썬 프로그래밍 단답형 300문항\n`;
  txt += `출제방식: 15개 영역 골고루 20문항 랜덤 출제\n\n`;

  rows.forEach(r => {
    txt += `[${r.idx}]\n`;
    txt += `영역: ${r.q.category}\n`;
    txt += `문제: ${r.q.question}\n`;
    txt += `정답: ${r.q.answer}\n`;
    txt += `학생답: ${r.user || "(미입력)"}\n`;
    txt += `결과: ${r.ok ? "정답" : "오답"}\n`;
    txt += `상세풀이: ${r.q.explanation}\n\n`;
  });

  const filename = `${safeFileName(studentId)}_${safeFileName(name)}_${score}점_단답형_${time}.txt`;
  const blob = new Blob([txt], {type: "text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(a.href);

  window.scrollTo({top: document.getElementById("resultCard").offsetTop - 10, behavior: "smooth"});
}

renderStats();
</script>
</body>
</html>
